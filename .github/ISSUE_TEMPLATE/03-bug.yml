name: Bug
description: 기대 동작과 다른 재현 가능한 동작을 기록합니다.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "진행 상태는 전용 Project에서 관리합니다. Issue 간 의존성은 생성 후 native dependency로 연결하세요. 미확인 정보는 미확인으로 적어주세요."
  - type: textarea
    id: context
    attributes:
      label: 배경 또는 문제
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 버전, 운영체제 및 관련 환경 정보를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 단계
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: 비목표
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 검증 가능한 완료 조건
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 외부 선행조건과 위험
      description: 없으면 없음으로 적고, Issue 간 선행관계 목록은 native dependency에서 관리하세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 관련 증거와 링크
      description: 로그, 화면, 관련 ADR 또는 구현을 링크하세요. 비밀정보는 제외하고, 없으면 없음으로 적어주세요.
    validations:
      required: true
